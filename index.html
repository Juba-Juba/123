<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13253b">
  <meta name="description" content="كل طرق التواصل مع النُخبة في مكان واحد. تواصل معنا عبر واتساب أو فيسبوك أو إنستجرام أو الهاتف، وثبّت التطبيق مباشرة.">
  <title>النُخبة | تواصل معنا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --navy:#14263d; --navy2:#0e1d30; --wine:#8b3148; --gold:#c7a06c; --cream:#fffdfa; --ink:#1c2c40; --muted:#768092; }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { margin:0; min-height:100vh; font-family:'Cairo',Tahoma,'Segoe UI',sans-serif; color:var(--ink); background:radial-gradient(ellipse at 4% 5%, #f7e8db 0%, transparent 36%), radial-gradient(ellipse at 98% 95%, #dfe7f2 0%, transparent 35%), #f7f8fb; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
    a { -webkit-tap-highlight-color: transparent; }
    .page { width:100%; max-width:494px; }
    .shell { background:rgba(255,255,255,.96); overflow:hidden; border:1px solid rgba(26,45,66,.08); border-radius:30px; box-shadow:0 24px 75px rgba(29,43,64,.11), 0 3px 18px rgba(29,43,64,.045); }
    .hero { position:relative; isolation:isolate; overflow:hidden; min-height:248px; text-align:center; color:white; background:linear-gradient(138deg,#1c3551 0%, #14263d 63%,#0b1728 100%); padding:29px 26px 32px; }
    .hero:before, .hero:after {content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07);z-index:-1;}
    .hero:before {width:280px;height:280px;right:-150px;top:-145px;box-shadow:0 0 0 36px rgba(255,255,255,.025),0 0 0 78px rgba(255,255,255,.015);}
    .hero:after {width:175px;height:175px;left:-90px;bottom:-120px;box-shadow:0 0 0 32px rgba(255,255,255,.025);}
    .identity { display:inline-flex; align-items:center; gap:12px; }
    .brand-mark { width:53px;height:53px;border:1px solid rgba(245,221,179,.55);border-radius:17px;display:grid;place-items:center;background:linear-gradient(155deg,rgba(220,186,126,.22),rgba(255,255,255,.04)); box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }
    .brand-mark svg {width:27px;height:27px;stroke:#edd4ac;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8;}
    .brand-name {font-size:27px;font-weight:900;letter-spacing:-.7px;line-height:1.5;}
    .overline {color:#e4c99f;font-size:11px;font-weight:800;letter-spacing:1px; margin:22px 0 4px;}
    h1 {font-size:27px;line-height:1.55;margin:0; font-weight:900;}
    .intro { font-size:12.5px; line-height:2; margin:5px auto 0; max-width:335px; color:#dce2eb; }
    .content { padding:27px 27px 23px; }
    .section-title { margin:0 2px 4px; font-size:16px; font-weight:900;}
    .section-caption {margin:0 2px 20px;font-size:12px;color:#7d8797;line-height:1.85;}
    .links {display:flex;flex-direction:column;gap:11px;}
    .link { position:relative; text-decoration:none; color:#24344b; display:flex; align-items:center; gap:14px; min-height:75px; border-radius:16px; padding:12px 14px; border:1px solid #e8ebf1; background:linear-gradient(120deg,#fff,#fcfdff); box-shadow:0 2px 6px rgba(20,40,63,.02); transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .link:hover,.link:focus-visible { transform:translateY(-2px);box-shadow:0 7px 20px rgba(20,40,63,.10);border-color:#cfd6e3;outline:none;}
    .link:active {transform:scale(.99);}
    .iconbox { flex:0 0 48px; width:48px;height:48px;border-radius:14px;display:grid;place-items:center; }
    .iconbox svg {width:25px;height:25px;display:block;}
    .link-title { font-size:14px;line-height:1.5;font-weight:900;}
    .link-sub {font-size:10.5px;color:#7c8694;line-height:1.8;margin-top:2px;}
    .arrow {margin-inline-start:auto; width:29px; height:29px; display:grid;place-items:center; background:#f3f5f8;border-radius:50%; color:#8f99a8;flex-shrink:0;}
    .arrow svg {width:15px;height:15px;}
    .wa .iconbox {background:#e8f8ee;color:#17a357;}
    .fb .iconbox {background:#eaf1ff;color:#1877f2;}
    .ig .iconbox {background:#fff0f3;color:#c13584;}
    .app .iconbox {background:#f6edf0;color:#8b3148;}
    .call {border-color:#263f59;background:linear-gradient(112deg,#1c3754,#13263e);color:white;}
    .call .iconbox {background:rgba(255,255,255,.12);color:#efcc9f;}
    .call .link-sub {color:#d7e1eb;}
    .call .arrow {background:rgba(255,255,255,.11);color:#eee;}
    .hint {display:flex;align-items:start;gap:10px;padding:16px;margin-top:19px;border-radius:15px;background:#fcf8f3;border:1px solid #f1e8dc;font-size:11px;line-height:2;color:#78654f;}
    .hint svg {flex:0 0 18px;width:18px;height:18px;margin-top:3px;color:#a98555;}
    .bottom {text-align:center;color:#949ca9;font-size:10.5px;margin:18px 10px 0;line-height:1.8;}
    @media(max-width:430px){ body{align-items:flex-start;padding:0;background:white;} .page{max-width:none;} .shell{border:0;border-radius:0;box-shadow:none;min-height:100svh;} .hero{min-height:235px;padding-top:24px;} .content{padding:25px 19px 22px;} .link{min-height:72px;} .bottom{margin:16px 16px 22px;} }
    @media(prefers-reduced-motion:reduce) { .link {transition:none;} }
  
:root{--navy:#061a33}
body{background:#f6f7fa;padding:18px 12px}
.hero{height:clamp(118px,18dvh,150px);min-height:0;padding:12px 23px 12px 18px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;text-align:right;background:#061a33}
.identity{display:flex;align-items:center;gap:7px;min-width:0;flex-shrink:0}
.brand-mark-img{width:clamp(67px,11dvh,92px);height:clamp(67px,11dvh,92px);object-fit:contain;flex:none}
.brand-lines{display:flex;flex-direction:column;align-items:flex-start}
.brand-name{font-size:clamp(20px,4.7vw,26px);color:#e6c47e;font-weight:900;white-space:nowrap}
.brand-tagline{font-size:clamp(9px,2.2vw,12px);color:#f0e5cb;font-weight:700;white-space:nowrap}
.hero-promise{color:#fff;font-size:clamp(12px,3.25vw,18px);line-height:1.65;font-weight:800;text-align:left;flex:1;min-width:0}
.content{padding:18px 20px 22px}
.section-title{font-size:14px;color:#455269;margin:0 1px 12px}
.links{gap:9px}
.link{height:clamp(59px,9dvh,73px);min-height:0}
@media(max-width:600px){
 html,body{height:100%;overflow:hidden}
 body{display:block;height:100svh;height:100dvh;min-height:0;padding:0;background:#fff}
 .page,.shell{height:100%;max-width:none}
 .shell{min-height:0;border:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column}
 .hero{height:clamp(118px,18dvh,150px);min-height:0;padding:12px 20px;flex:0 0 auto}
 .content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(12px,2.6dvh,21px) 17px}

}
@media(max-height:620px) and (max-width:600px){
 .hero{height:104px;padding-inline:12px}
